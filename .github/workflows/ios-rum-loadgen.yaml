name: iOS RUM Loadgen

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  replay:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      RUM_LOADGEN_SIMULATOR: iPhone 15
      RUM_LOADGEN_BUNDLE_ID: com.splunk.bankofsplunk
      RUM_LOADGEN_RUM_FLUSH_SECONDS: "30"
      RUM_LOADGEN_APPIUM_URL: http://127.0.0.1:4791
      RUM_LOADGEN_START_APPIUM: "1"
      RUM_LOADGEN_API_URL: https://eua-bank.splunko11y.com
      RUM_LOADGEN_REQUIRE_API: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r src/ios/rum-loadgen/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium and XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "${RUM_LOADGEN_SIMULATOR}" 2>/dev/null || true
          open -a Simulator || true

      - name: Configure Secrets.xcconfig for CI
        env:
          SPLUNK_RUM_ACCESS_TOKEN: ${{ secrets.SPLUNK_RUM_ACCESS_TOKEN }}
          SPLUNK_RUM_REALM: ${{ secrets.SPLUNK_RUM_REALM }}
          SPLUNK_RUM_APP_NAME: ${{ secrets.SPLUNK_RUM_APP_NAME }}
          SPLUNK_RUM_DEPLOYMENT_ENVIRONMENT: ${{ secrets.SPLUNK_RUM_DEPLOYMENT_ENVIRONMENT }}
        run: |
          CONFIG=src/ios/BankOfSplunk/Config/Secrets.xcconfig
          if [ ! -f "$CONFIG" ]; then
            echo "Missing $CONFIG in repository." >&2
            exit 1
          fi

          if [ -z "$SPLUNK_RUM_ACCESS_TOKEN" ]; then
            echo "SPLUNK_RUM_ACCESS_TOKEN repository secret is required for CI." >&2
            exit 1
          fi

          sed -i '' 's|^API_BASE_URL = .*|API_BASE_URL = https:/$()/eua-bank.splunko11y.com|' "$CONFIG"
          sed -i '' "s|^SPLUNK_RUM_ACCESS_TOKEN = .*|SPLUNK_RUM_ACCESS_TOKEN = ${SPLUNK_RUM_ACCESS_TOKEN}|" "$CONFIG"

          if [ -n "$SPLUNK_RUM_REALM" ]; then
            sed -i '' "s|^SPLUNK_RUM_REALM = .*|SPLUNK_RUM_REALM = ${SPLUNK_RUM_REALM}|" "$CONFIG"
          fi
          if [ -n "$SPLUNK_RUM_APP_NAME" ]; then
            sed -i '' "s|^SPLUNK_RUM_APP_NAME = .*|SPLUNK_RUM_APP_NAME = ${SPLUNK_RUM_APP_NAME}|" "$CONFIG"
          fi
          if [ -n "$SPLUNK_RUM_DEPLOYMENT_ENVIRONMENT" ]; then
            sed -i '' "s|^SPLUNK_RUM_DEPLOYMENT_ENVIRONMENT = .*|SPLUNK_RUM_DEPLOYMENT_ENVIRONMENT = ${SPLUNK_RUM_DEPLOYMENT_ENVIRONMENT}|" "$CONFIG"
          else
            sed -i '' 's|^SPLUNK_RUM_DEPLOYMENT_ENVIRONMENT = .*|SPLUNK_RUM_DEPLOYMENT_ENVIRONMENT = bank-ci|' "$CONFIG"
          fi

      - name: Build and replay scenarios
        run: |
          cd src/ios/rum-loadgen
          ./scripts/run-all.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-rum-loadgen-logs
          path: |
            /tmp/bank-of-splunk-appium.log
            ${{ runner.temp }}/bank-of-splunk-derived.*
          if-no-files-found: ignore
