    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  {% if cymbal_logo == "true" %}
    <title>CymbalBank</title>
  {% else %}
    <title>{{ bank_name }}</title>
  {% endif %}
    <link rel="icon" href="static/img/favicon.ico"/>
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-material-design@4.1.1/dist/css/bootstrap-material-design.min.css" integrity="sha384-wXznGJNEXNG1NFsbm0ugrLFMQPWswR3lds2VeinahP8N0zJw9VWSopbjv2x7WCvX" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="static/styles/cymbal.css">
  {% if platform_name is not none %}
    <link rel="stylesheet" href="static/styles/platform.css">
    <link rel="stylesheet" href="static/styles/platform/{{ platform }}.css">
  {% endif %}
  {% if rum_enabled %}
    <script src="https://cdn.observability.splunkcloud.com/o11y-gdi-rum/v3/splunk-otel-web.js" crossorigin="anonymous"></script>
    <script src="https://cdn.observability.splunkcloud.com/o11y-gdi-rum/v3/splunk-otel-web-session-recorder.js" crossorigin="anonymous"></script>
    <script>
        SplunkRum.init({
            realm: "{{ rum_realm }}",
            rumAccessToken: "{{ rum_auth }}",
            applicationName: "{{ rum_app_name }}",
            version: "{{ splunk_version }}",
            deploymentEnvironment: "{{ rum_environment }}",
            user: { trackingMode: 'anonymousTracking' },
            dataAttributesToCapture: ['data-trackid', 'data-component', 'data-flow'],
            globalAttributes: {
                platform: "{{ platform or 'unknown' }}",
            },
            disableBots: true,
            exporter: {
                otlp: true,
                onAttributesSerializing: function (attrs) {
                    var blocked = /account|password|token|session|email|user/i;
                    var sanitized = {};
                    Object.keys(attrs || {}).forEach(function (key) {
                        if (!blocked.test(key)) {
                            sanitized[key] = attrs[key];
                        }
                    });
                    return sanitized;
                },
            },
            privacy: {
                maskAllText: true,
                sensitivityRules: [
                    { rule: 'unmask', selector: 'h1, h2, h3, h4, h5, h6' },
                    { rule: 'unmask', selector: 'button, .btn, .card-button' },
                    { rule: 'unmask', selector: '.navbar-brand, .nav-link, .dropdown-item' },
                    { rule: 'mask', selector: '#account-user-name, .account-number, #current-balance' },
                    { rule: 'mask', selector: 'input, select, textarea, .transaction-account, .transaction-amount' },
                    { rule: 'exclude', selector: '#login-password, #signup-password, #signup-password-repeat' },
                ],
            },
        });

        SplunkSessionRecorder.init({
            realm: "{{ rum_realm }}",
            rumAccessToken: "{{ rum_auth }}",
            recorder: 'splunk'
        });
    </script>
  {% endif %}
